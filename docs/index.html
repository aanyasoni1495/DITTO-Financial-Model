<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DITTO AOV Simulator</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: #666; margin-bottom: 24px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .card { background: #f5f5f4; border-radius: 8px; padding: 16px; }
  .card-label { font-size: 13px; color: #666; margin-bottom: 4px; }
  .card-value { font-size: 24px; font-weight: 600; }
  .section-label { font-size: 13px; font-weight: 600; margin: 20px 0 8px; }
  .input-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .input-group label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; }
  input[type=number] { width: 100%; padding: 8px; border: 1px solid #d4d4d4; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
  .slider-row { margin-bottom: 12px; }
  .slider-row-label { display: flex; justify-content: space-between; font-size: 12px; color: #666; margin-bottom: 4px; }
  input[type=range] { width: 100%; }
  #chartWrap { position: relative; width: 100%; height: 280px; margin-bottom: 8px; }
  .note { font-size: 11px; color: #999; }
  .meta { font-size: 11px; color: #999; margin-top: 4px; }
</style>
</head>
<body>

<h1>DITTO AOV simulator</h1>
<p class="subtitle">Set hypothetical prices and plan mix to see the effect on blended AOV. Assumes retention is unchanged by price.</p>

<div class="cards">
  <div class="card"><div class="card-label">Blended AOV, month 6</div><div class="card-value" id="aov-out">£0.00</div></div>
  <div class="card"><div class="card-label">vs current sheet</div><div class="card-value" id="delta-out">£0.00</div></div>
</div>

<div class="section-label">Recurring prices</div>
<div class="input-grid">
  <div class="input-group"><label>Monthly (£)</label><input type="number" id="price-monthly" value="40" min="0" step="1"></div>
  <div class="input-group"><label>3-Month (£)</label><input type="number" id="price-3month" value="100" min="0" step="1"></div>
  <div class="input-group"><label>OTP (£)</label><input type="number" id="price-otp" value="50" min="0" step="1"></div>
</div>

<div class="section-label">First-purchase discount</div>
<div class="input-grid">
  <div class="input-group"><label>Monthly (%)</label><input type="number" id="disc-monthly" value="0" min="0" max="100" step="1"></div>
  <div class="input-group"><label>3-Month (%)</label><input type="number" id="disc-3month" value="0" min="0" max="100" step="1"></div>
</div>
<div class="section-label">Mix (must total 100%)</div>
<div class="input-grid">
  <div class="input-group"><label>Monthly (%)</label><input type="number" id="mix-monthly" value="30" min="0" max="100" step="1"></div>
  <div class="input-group"><label>3-Month (%)</label><input type="number" id="mix-3month" value="65" min="0" max="100" step="1"></div>
  <div class="input-group"><label>OTP (%)</label><input type="number" id="mix-otp" value="5" min="0" max="100" step="1"></div>
</div>
<div id="mix-warning" style="display: none; font-size: 13px; color: #b3261e; margin: -8px 0 20px;"></div>
<div id="mix-ok" style="font-size: 13px; color: #1a7a3f; margin: -8px 0 20px;">Totals 100%</div>

<div id="chartWrap"><canvas id="aovChart"></canvas></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const CURRENT_PRICE_M = 40, CURRENT_PRICE_3 = 100;
const CURRENT_MIX_M = 0.30, CURRENT_MIX_3 = 0.65;

let monthlyCurve = [1.0];
let threeMonthCurveCycles = [1.0];
let chart;

function threeMonthRevAt(month, price, disc) {
  if (month % 3 !== 0) return 0;
  const cyc = month / 3;
  const r = cyc < threeMonthCurveCycles.length ? threeMonthCurveCycles[cyc] : threeMonthCurveCycles[threeMonthCurveCycles.length-1];
  const effectivePrice = cyc === 0 ? price * (1 - disc/100) : price;
  return effectivePrice * r;
}
function monthlyRevAt(month, price, disc) {
  const r = month < monthlyCurve.length ? monthlyCurve[month] : monthlyCurve[monthlyCurve.length-1];
  const effectivePrice = month === 0 ? price * (1 - disc/100) : price;
  return effectivePrice * r;
}
function blendedAovAt(month, pM, p3, dM, d3, mM, m3) {
  return mM * monthlyRevAt(month, pM, dM) + m3 * threeMonthRevAt(month, p3, d3);
}

const els = {
  pM: document.getElementById('price-monthly'),
  p3: document.getElementById('price-3month'),
  pO: document.getElementById('price-otp'),
  dM: document.getElementById('disc-monthly'),
  d3: document.getElementById('disc-3month'),
  mM: document.getElementById('mix-monthly'),
  m3: document.getElementById('mix-3month'),
  mO: document.getElementById('mix-otp'),
};
const outs = {};

function checkMix() {
  const total = Number(els.mM.value || 0) + Number(els.m3.value || 0) + Number(els.mO.value || 0);
  const diff = 100 - total;
  const warn = document.getElementById('mix-warning');
  const ok = document.getElementById('mix-ok');
  if (Math.abs(diff) < 0.01) {
    warn.style.display = 'none';
    ok.style.display = 'block';
    return { valid: true, m: Number(els.mM.value)/100, t: Number(els.m3.value)/100, o: Number(els.mO.value)/100 };
  }
  ok.style.display = 'none';
  warn.style.display = 'block';
  warn.textContent = diff > 0
    ? 'Totals ' + total.toFixed(0) + '%. Add ' + diff.toFixed(0) + ' more to reach 100%.'
    : 'Totals ' + total.toFixed(0) + '%. Remove ' + Math.abs(diff).toFixed(0) + ' to reach 100%.';
  return { valid: false };
}

function update() {
  const mix = checkMix();
  const pM = Number(els.pM.value) || 0;
  const p3 = Number(els.p3.value) || 0;
  const dM = Number(els.dM.value) || 0;
  const d3 = Number(els.d3.value) || 0;

  const months = Array.from({length: 13}, (_, i) => i);
  const currentAov = months.map(t => blendedAovAt(t, CURRENT_PRICE_M, CURRENT_PRICE_3, 0, 0, CURRENT_MIX_M, CURRENT_MIX_3));

  const aovOut = document.getElementById('aov-out');
  const deltaEl = document.getElementById('delta-out');

  if (!mix.valid) {
    aovOut.textContent = '\u2014';
    deltaEl.textContent = 'Fix mix total first';
    deltaEl.style.color = '#b3261e';
    if (chart) { chart.data.datasets[1].data = []; chart.update(); }
    return;
  }

  const scenarioAov = months.map(t => blendedAovAt(t, pM, p3, dM, d3, mix.m, mix.t));
  aovOut.textContent = '£' + scenarioAov[6].toFixed(2);
  const delta = scenarioAov[6] - currentAov[6];
  deltaEl.textContent = (delta >= 0 ? '+£' : '-£') + Math.abs(delta).toFixed(2);
  deltaEl.style.color = delta >= 0 ? '#1a7a3f' : '#b3261e';

  if (chart) {
    chart.data.datasets[0].data = currentAov;
    chart.data.datasets[1].data = scenarioAov;
    chart.update();
  } else {
    chart = new Chart(document.getElementById('aovChart'), {
      type: 'line',
      data: {
        labels: months,
        datasets: [
          { label: 'Current sheet', data: currentAov, borderColor: '#8a8a86', borderWidth: 2, pointRadius: 3, pointHoverRadius: 5, tension: 0.15 },
          { label: 'Your scenario', data: scenarioAov, borderColor: '#2f6fb3', borderWidth: 2, pointRadius: 3, pointHoverRadius: 5, tension: 0.15 },
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: true, position: 'top', labels: { boxWidth: 12, font: { size: 12 } } },
          tooltip: { mode: 'index', intersect: false, callbacks: { label: (c) => c.dataset.label + ': £' + c.parsed.y.toFixed(2) } }
        },
        scales: {
          x: { title: { display: true, text: 'Months since signup', font: { size: 11 } }, grid: { display: false } },
          y: { title: { display: true, text: 'Blended AOV (£)', font: { size: 11 } }, grid: { color: 'rgba(0,0,0,0.06)' } }
        }
      }
    });
  }
}

fetch('curves.json')
  .then(r => r.json())
  .then(data => {
    monthlyCurve = data.monthly_curve;
    threeMonthCurveCycles = data.threemonth_curve_cycles;
    update();
  })
  .catch(() => {
    update();
  });

[els.pM, els.p3, els.pO, els.dM, els.d3, els.mM, els.m3, els.mO].forEach(el => el.addEventListener('input', update));
</script>
</body>
</html>
